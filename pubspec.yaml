name: todo_app
description: "To-Do List app (MVC + GetX + Firebase) for Mobile Application Development-II."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Bundled so google_fonts never downloads at runtime (works offline and
    # in tests). Licenses are registered in main.dart.
    - assets/google_fonts/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/AppIcon.png"
  adaptive_icon_background: "#FDEBD3"
  adaptive_icon_foreground: "assets/images/AppIcon.png"
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21